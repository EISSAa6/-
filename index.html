<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1b1f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الطبيّات">
<title>متابعة الطبيّات</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--pr:#0f766e;--rd:#b91c1c;--gn:#15803d;--am:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--pr:#2dd4bf;--rd:#f87171;--gn:#4ade80;--am:#fbbf24}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--pr:#2dd4bf;--rd:#f87171;--gn:#4ade80;--am:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5;padding:12px}
h1{font-size:1.25rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label{font-size:.8rem;color:var(--mu);display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.x{background:transparent;color:var(--rd);padding:2px 8px;border:1px solid var(--rd)}
@media (prefers-color-scheme:dark){button{color:#0b1210}}
details>summary{cursor:pointer;font-weight:600}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{flex:1 1 100px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem}
.stat{cursor:pointer}
.stat.sel{outline:2px solid var(--pr)}
.li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.li small{color:var(--mu)}
.stat span{font-size:.75rem;color:var(--mu)}
.li small,td small{white-space:nowrap}
.stat small{display:block;font-size:.72rem;color:var(--mu);margin-top:2px}
.scroll{overflow:visible}
table{width:100%;border-collapse:collapse;font-size:.74rem;table-layout:fixed}
#tb .b,.li .b{font-size:.62rem;padding:2px 3px}
#tb td small{font-size:.62rem}
th,td{padding:7px 3px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
th{color:var(--mu);font-weight:600;font-size:.8rem}
tr.s{cursor:pointer}
.b{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.78rem;border:1px solid currentColor}
.on{color:var(--rd)}.up{color:var(--am)}.end{color:var(--gn)}
.cnt{font-weight:700}
.sub td{background:var(--bg);font-size:.85rem}
#msg{font-size:.85rem;color:var(--mu);margin-top:6px}
.rs td{background:rgba(185,28,28,.16)}
.rs td:nth-child(2){font-weight:700}
.hs td{background:rgba(180,83,9,.16)}
.hs td:nth-child(2){font-weight:700}
.dt{position:relative;height:40px}
.dt .dv{height:100%;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);font-weight:600;direction:ltr}
.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.hero{display:none}
#splash{position:fixed;inset:0;z-index:99;background:#1b1f24;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .5s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .s1{animation:txin .6s ease-out .8s both;font-size:1.7rem;font-weight:800}
#splash .s2{animation:txin .6s ease-out 1.05s both;font-size:1.1rem;margin-top:6px;opacity:.9}
#splash .s3{font-size:1.5rem;font-weight:700;margin-top:4px}
#splash .s4{font-size:.8rem;opacity:.8;margin-top:28px}
@keyframes lgin{0%{opacity:0;transform:scale(.4) rotate(-200deg)}65%{opacity:1;transform:scale(1.08) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes txin{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,190,60,0))}50%{filter:drop-shadow(0 0 18px rgba(255,190,60,.55))}}
#splash.out .sp{transform:scale(1.15);transition:transform .5s}
#splash .lg{animation:lgin 1.1s cubic-bezier(.2,.8,.3,1) both,glow 1.4s ease-in-out 1.1s;width:min(62vw,260px);height:auto;display:block;margin:0 auto 22px}
.hero{text-align:center;background:var(--pr);color:#fff;border-radius:12px;padding:16px 10px;margin-bottom:12px}
.hero .h1{font-size:1.5rem;font-weight:800}
.hero .h2{font-size:1rem;margin-top:2px;opacity:.95}
@media (prefers-color-scheme:dark){.hero{color:#0b1210}}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.sg{display:none;max-height:240px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-top:4px}
.sg div{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer}
.sg small{color:var(--mu)}
.tabs button{flex:1}
</style>
</head>

function sug(){

function fixDigits(s){return s.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})}
function bulkAdd(){
  var lines=fixDigits($('bulk').value).split('\n'),ok=0,bad=0;
  lines.forEach(function(L){
    if(!L.trim())return;
    var re=/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/g,m,ds=[];
    while((m=re.exec(L))){
      var y,mo,d;
      if(m[1].length==4){y=+m[1];mo=+m[2];d=+m[3]}else{d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
      ds.push(y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
    }
    var name=L.replace(re,' ').replace(/[\t,،;؛|]+/g,' ').replace(/\s+/g,' ').trim();
    if(ds.length<2||!name||ds[1]<ds[0]){bad++;return}
    data.push({id:Date.now()+Math.random(),n:name,s:ds[0],e:ds[1]});ok++;
  });
  save();$('bulk').value='';msg('تم استيراد '+ok+' سجل'+(bad?' — وتعذر قراءة '+bad+' سطر':''));render();
}

    x.end=x.ls.reduce(function(m,l){return l.e>m?l.e:m},'');
    var cur=x.ls.filter(function(l){return l.s<=today&&l.e>=today})[0];
    var fut=x.ls.filter(function(l){return l.s>today}).sort(function(a,b){return a.s<b.s?-1:1})[0];
    if(cur){x.st='on';x.txt='طبية — '+endInfo(cur.e);x.until=cur.e}
    else if(fut){x.st='up';x.txt='تبدأ '+fut.s;x.until=fut.e}
    else{x.st='end';x.txt='منتهية';x.until=x.end}
    return x;
  });
}
function render(){
  var g=group(),q=norm($('q').value),f=$('f').value,o=$('o').value;
  var names={};FLAT.forEach(function(s){names[s.n]=1});data.forEach(function(l){names[l.n]=1});
  
  var all=group(),dk={},nOn=0,nH=0,nR=FLAT.filter(function(s){return s.r}).length;
  all.forEach(function(x){if(x.st=='on'){dk[x.k]=1;nOn++}});
  FLAT.forEach(function(s){if(s.h){nH++;dk[norm(s.n)]=1}});
  var dfc=Object.keys(dk).length;
  $('c1').textContent=FLAT.length;$('c1s').textContent=nR?('منهم '+nR+' مستقيل'):'';
  $('c2').textContent=dfc;$('c2s').textContent='طبية '+nOn+' · مستشفى خارجي '+nH;
  $('c3').textContent=FLAT.length-nR-dfc;$('c3s').textContent='بعد خصم المستقيل والعجز';
  $('s1').textContent=g.filter(function(x){return x.st=='end'}).length;
  $('s2').textContent=g.filter(function(x){return x.st=='on'}).length;
  $('s3').textContent=FLAT.filter(function(s){return s.h}).length;
  g=g.filter(function(x){
    if(q&&x.k.indexOf(q)<0)return false;
    if(f=='on')return x.st=='on';
    if(f=='hosp')return x.pl&&x.pl.h;
    if(f=='end')return x.st=='end';
    return true;
  });
  g.sort(function(a,b){
    if(o=='name')return a.k<b.k?-1:1;
    if(o=='end'){if(a.st=='on'&&b.st!='on')return -1;if(b.st=='on'&&a.st!='on')return 1;return a.until<b.until?-1:1}
    return b.cnt-a.cnt||(a.k<b.k?-1:1);
  });
  var h='';
  g.forEach(function(x){
    var kk=esc(x.k).replace(/'/g,'');
    h+='<tr class="s" data-k="'+esc(x.k)+'"><td>'+esc(x.name)+(x.pl?' <small style="color:var(--mu)">'+esc(x.pl.code)+'</small>':'')+(x.pl&&x.pl.r?' <span class="b on">استقالة</span>':'')+(x.pl&&x.pl.h?' <span class="b up">مستشفى خارجي</span>':'')+'</td><td>'+sd(x.end)+'</td><td><span class="b '+x.st+'">'+esc(x.txt)+'</span></td></tr>';
    if(open[x.k]){
      x.ls.forEach(function(l){
        h+='<tr class="sub"><td>من '+l.s+'</td><td>إلى '+l.e+'</td><td>'+days(l)+' يوم <button class="x" data-del="'+l.id+'">حذف</button></td></tr>';
      });
    }
  });
  $('tb').innerHTML=h;
  $('empty').style.display=data.length?'none':'block';
  renderRoster();renderList();
}
$('tb').addEventListener('click',function(e){
  var d=e.target.closest('[data-del]');
  if(d){del(d.getAttribute('data-del'));return}
  var r=e.target.closest('tr.s');
  if(r)toggle(r.getAttribute('data-k'));
});
function hideSplash(){var e=document.getElementById('splash');if(e)e.classList.add('out')}
setTimeout(hideSplash,2500);
mkDate('a');mkDate('b',true);
render();
setInterval(function(){var ai=$('ai');if(ai&&!ai.dataset.t&&ai.value!==iso(new Date())){ai.value=iso(new Date())}render()},60000);
$('ai').addEventListener('change',function(){this.dataset.t=1});
</script>
